[package]
name = "r-steelseries"
version = "0.1.0"
edition = "2021"
authors = ["MikhaelCat"]
description = "High-performance Rust driver and CLI for SteelSeries MSI RGB keyboards, lightbars, and dragon logos"
license = "GPL-3.0-or-later"
repository = "https://github.com/MikhaelCat/r-steelseries.git"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
nix = { version = "0.29", features = ["ioctl", "fs"] }
libc = "0.2"
rand = "0.8"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "packet_bench"
harness = false
