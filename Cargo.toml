[package]
name = "r-rgb"
version = "1.0.0"
edition = "2021"
authors = ["MikhaelCat"]
description = "High-performance Rust driver and Adwaita GUI for Linux RGB keyboards, lightbars, and dragon logos"
license = "MIT OR Apache-2.0"
repository = "https://github.com/MikhaelCat/r-rgb.git"

[[bin]]
name = "rrgb"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
clap_complete = "4.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
nix = { version = "0.29", features = ["ioctl", "fs"] }
libc = "0.2"
rand = "0.8"
gtk4 = { version = "0.11.5", features = ["v4_12"] }
libadwaita = { version = "0.9.2", features = ["v1_5"] }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "packet_bench"
harness = false
